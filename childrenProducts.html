                        <li>动物园、野生动物救助站的户外急救医疗。</li>

            '102': {
                name: 'FortisMed GCK-P1 电子胃肠镜',

                images: [
                    './images/便携胃肠镜-FortisMed GCK-P1.png',

                    <p>广泛应用于兽医诊所的牙科清洁、抛光、牙结石去除，以及马匹牙齿的日常打磨与修整（配合开口器使用）。</p>
                `
            }
        };

        // 2. Main Logic
        document.addEventListener('DOMContentLoaded', () => {
            // Mobile Menu Toggle
            const btn = document.getElementById('mobile-menu-btn');
            const menu = document.getElementById('mobile-menu');
            if(btn && menu) {
                btn.addEventListener('click', () => {
                    menu.classList.toggle('hidden');
                    const icon = btn.querySelector('i');
                    if (menu.classList.contains('hidden')) {
                        icon.classList.remove('fa-xmark');
                        icon.classList.add('fa-bars');
                    } else {
                        icon.classList.remove('fa-bars');
                        icon.classList.add('fa-xmark');
                    }
                });
            }

            // Tabs Logic
            const tabBtns = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');

            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Remove active from all
                    tabBtns.forEach(b => b.classList.remove('active'));
                    tabContents.forEach(c => c.classList.remove('active'));
                    
                    // Add active to clicked
                    btn.classList.add('active');
                    document.getElementById(btn.dataset.target).classList.add('active');
                });
            });

            // Load Data Logic
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            
            const loadingState = document.getElementById('loading-state');
            const errorState = document.getElementById('error-state');
            const contentState = document.getElementById('product-content');

            // Simulate Network Request Delay (Optional, for realism)
            setTimeout(() => {
                loadingState.classList.add('hidden');

                if (productId && productDatabase[productId]) {
                    renderProduct(productDatabase[productId]);
                    contentState.classList.remove('hidden');
                } else {
                    errorState.classList.remove('hidden');
                }
            }, 400); // 400ms delay
        });

        // 3. Render DOM Function
        function renderProduct(data) {
            // Basic Text
            document.title = `${data.name} - 迹微兽医设备 (FortisMed)`;
            document.getElementById('breadcrumb-product-name').textContent = data.name;
            document.getElementById('product-name').textContent = data.name;
            document.getElementById('product-model').textContent = data.model;
            document.getElementById('product-category').textContent = data.category;
            document.getElementById('product-desc').textContent = data.description;

            // Features (Bullets)
            const featuresContainer = document.getElementById('product-features');
            featuresContainer.innerHTML = '';
            data.features.forEach(feat => {
                featuresContainer.innerHTML += `
                    <li class="flex items-center text-slate-700 bg-slate-50 px-3 py-2 rounded-lg border border-slate-100">
                        <i class="fa-solid fa-check text-green-500 mr-3"></i>
                        <span class="text-sm font-medium">${feat}</span>
                    </li>
                `;
            });

            // Images (Gallery)
            const mainImg = document.getElementById('main-image');
            const thumbContainer = document.getElementById('thumbnail-container');
            
            if(data.images && data.images.length > 0) {
                mainImg.src = data.images[0];
                thumbContainer.innerHTML = '';
                
                data.images.forEach((imgSrc, index) => {
                    const thumb = document.createElement('div');
                    thumb.className = `thumbnail w-20 h-20 flex-shrink-0 rounded-lg border-2 cursor-pointer p-1 transition-all ${index === 0 ? 'active' : 'border-transparent opacity-60 hover:opacity-100'}`;
                    thumb.innerHTML = `<img src="${imgSrc}" class="w-full h-full object-cover rounded-md bg-gray-50">`;
                    
                    thumb.addEventListener('click', () => {
                        // Change main image with slight fade effect
                        mainImg.style.opacity = '0.5';
                        setTimeout(() => {
                            mainImg.src = imgSrc;
                            mainImg.style.opacity = '1';
                        }, 150);

                        // Update active state
                        document.querySelectorAll('.thumbnail').forEach(t => {
                            t.classList.remove('active');
                            t.classList.add('border-transparent', 'opacity-60');
                        });
                        thumb.classList.add('active');
                        thumb.classList.remove('border-transparent', 'opacity-60');
                    });
                    
                    thumbContainer.appendChild(thumb);
                });
            }

            // Specs Table
            const specsTable = document.getElementById('product-specs-table');
            specsTable.innerHTML = '';
            data.specs.forEach(spec => {
                specsTable.innerHTML += `
                    <tr class="border-b border-slate-200 last:border-0">
                        <th class="py-4 px-6 text-slate-900 font-medium w-1/3 bg-slate-50 border-r border-slate-200">${spec.label}</th>
                        <td class="py-4 px-6 text-slate-600">${spec.value}</td>
                    </tr>
                `;
            });

            // HTML Content Tabs
            document.getElementById('product-advantages').innerHTML = data.advantages;
            document.getElementById('product-applications').innerHTML = data.applications;
        }
    </script>
</body>
</html>
